# Render Blueprint: one Node web service that builds the client and serves it
# alongside the Socket.IO game server.
services:
  - type: web
    name: breachline
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Postgres connection string (Neon / Supabase). Secret: set it in the
      # Render dashboard under Environment, never in this file.
      - key: DATABASE_URL
        sync: false
      # The owner's username and any extra admins (comma-separated). Set them
      # in the Render dashboard; there is no way to become one from inside the game.
      - key: OWNER_USERNAME
        sync: false
      - key: ADMIN_USERNAMES
        sync: false
